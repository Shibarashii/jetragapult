background_opacity          0.8
cursor_trail                1
# window_padding_width        25

include themes/noctalia.conf

# Ctrl+Backspace sends ^H, which is indistinguishable from Ctrl+h (vim-tmux-navigator).
# Remap it to ^W (delete previous word) so it no longer triggers pane navigation.
map ctrl+backspace send_text all \x17
